info:
  name: Portfolio details
  type: http
  seq: 5

http:
  method: GET
  url: https://api.rise.trade/v1/portfolio/details?account={{wallet}}
  params:
    - name: account
      value: "{{wallet}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
